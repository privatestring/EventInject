apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'


android {
    namespace "com.joker.event"
    //noinspection GradleDependency
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "com.joker.event"
        minSdkVersion 23
        //noinspection OldTargetApi
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    ksp {
        arg("module_name", "TradeAccount")
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation project(':EventAnnotation')
    ksp project(':EventInjectCompiler')

    implementation project(':launcher-joke')
    ksp project(':launcher-compiler-ksp')
    ksp project(':launcher-compiler-wb-ksp')
}
